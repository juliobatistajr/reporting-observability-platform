name: Portfolio demo checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src demo.py tests
      - name: Run offline demo tests
        run: python -m unittest discover -s tests -v
      - name: Run anomaly detector
        run: python -m src.anomaly_detector.detector
